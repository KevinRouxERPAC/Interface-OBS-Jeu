<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Qui veut passer pour un teubé</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ─── Header ─────────────────────────────────────── -->
  <header id="header">
    <div class="header-left">
      <h1>Qui veut passer pour un teub&eacute;</h1>
      <span class="subtitle">Interface d'administration</span>
    </div>
    <div class="header-right">
      <div class="status-indicators">
        <span id="ws-status" class="status-badge disconnected" title="WebSocket">
          <span class="status-dot"></span> WS
        </span>
        <span id="gs-status" class="status-badge disconnected" title="Google Sheets">
          <span class="status-dot"></span> GSheets
        </span>
      </div>
      <button id="btn-refresh-data" class="btn btn-secondary" title="Rafraîchir les données">
        &#x21BB; Rafra&icirc;chir
      </button>
    </div>
  </header>

  <!-- ─── Dashboard ──────────────────────────────────── -->
  <main>
    <section id="dashboard" class="panel">
      <h2>Tableau de bord</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-questions">0</div>
          <div class="stat-label">Questions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-themes">0</div>
          <div class="stat-label">Th&egrave;mes</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-asked">0</div>
          <div class="stat-label">Pos&eacute;es</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-state">Attente</div>
          <div class="stat-label">&Eacute;tat du jeu</div>
        </div>
      </div>
    </section>

    <!-- ─── Game Controls ────────────────────────────── -->
    <section id="game-controls" class="panel">
      <h2>Contr&ocirc;les du jeu</h2>

      <!-- Current Question Display -->
      <div id="current-question-display" class="current-question hidden">
        <h3 id="cq-title">Question en cours</h3>
        <p id="cq-text" class="question-text"></p>
        <div id="cq-meta" class="question-meta"></div>
        <div id="cq-propositions" class="propositions-grid"></div>
        <p id="cq-explanation" class="explanation hidden"></p>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="btn-reveal" class="btn btn-warning" disabled>R&eacute;v&eacute;ler la r&eacute;ponse</button>
        <button id="btn-next" class="btn btn-primary" disabled>Suivant</button>
        <button id="btn-scores" class="btn btn-info">Scores</button>
        <button id="btn-reset" class="btn btn-danger">R&eacute;initialiser</button>
      </div>
    </section>

    <!-- ─── Scores ───────────────────────────────────── -->
    <section id="scores-panel" class="panel">
      <h2>Scores</h2>
      <div class="scores-form">
        <input type="text" id="player-name" placeholder="Nom du joueur" class="input">
        <button id="btn-add-point" class="btn btn-success">+1</button>
        <button id="btn-remove-point" class="btn btn-danger">-1</button>
      </div>
      <div id="scores-list" class="scores-list">
        <p class="empty-state">Aucun score pour l'instant</p>
      </div>
    </section>

    <!-- ─── Question Selector ────────────────────────── -->
    <section id="question-selector" class="panel">
      <h2>S&eacute;lection de question</h2>

      <!-- Filters -->
      <div class="filters">
        <select id="filter-matiere" class="select">
          <option value="">Toutes les mati&egrave;res</option>
        </select>
        <select id="filter-category" class="select">
          <option value="">Toutes les cat&eacute;gories</option>
        </select>
        <select id="filter-theme" class="select">
          <option value="">Tous les th&egrave;mes</option>
        </select>
        <select id="filter-level" class="select">
          <option value="">Tous les niveaux</option>
        </select>
        <button id="btn-random" class="btn btn-primary">Question al&eacute;atoire</button>
      </div>

      <!-- Question List -->
      <div id="question-list" class="question-list">
        <p class="empty-state">Chargement des questions...</p>
      </div>
    </section>
  </main>

  <!-- ─── Toast / Notification ───────────────────────── -->
  <div id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="admin.js"></script>
</body>
</html>
