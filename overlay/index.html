<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay - Qui veut passer pour un teubé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="overlay-container">

    <!-- Écran d'attente (style jeu TV) -->
    <div id="screen-waiting" class="screen active">
      <div class="waiting-content">
        <h1 class="game-title">Qui veut passer<br>pour un teub&eacute; ?</h1>
        <p class="waiting-subtitle">Émission de jeu</p>
        <div class="waiting-pulse"></div>
      </div>
    </div>

    <!-- Écran Sélection : affiche les sélections faites + étape courante -->
    <div id="screen-selection" class="screen">
      <div class="selection-content">
        <div id="selection-summary" class="selection-summary">
          <!-- Sélections déjà faites (visible par spectateurs et participants) -->
        </div>
        <h2 id="selection-title" class="selection-title">Choisis la matière</h2>
        <div id="selection-steps" class="selection-steps">
          <!-- Rempli par overlay.js selon l'étape -->
        </div>
      </div>
    </div>

    <!-- Écran Question : plateau type émission (question + 4 réponses A B C D) -->
    <div id="screen-question" class="screen">
      <div class="game-show-set">
        <div class="question-banner">
          <span id="q-counter" class="q-counter">Question 1</span>
          <div id="q-tags" class="q-tags"></div>
          <div id="q-text" class="q-text"></div>
        </div>
        <div id="q-propositions" class="answers-grid"></div>
      </div>
    </div>

    <!-- Écran Réponse : même plateau avec révélation bonne/mauvaise -->
    <div id="screen-answer" class="screen">
      <div class="game-show-set">
        <div class="question-banner">
          <span id="a-counter" class="q-counter">Question 1</span>
          <div id="a-text" class="q-text"></div>
        </div>
        <div id="a-propositions" class="answers-grid"></div>
        <div id="a-result" class="result-banner hidden"></div>
        <div id="a-explanation" class="explanation hidden"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
