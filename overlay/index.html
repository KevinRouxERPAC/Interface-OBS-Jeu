<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay - Qui veut passer pour un teubé</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="overlay-container">

    <!-- ─── Écran d'attente ──────────────────────────── -->
    <div id="screen-waiting" class="screen active">
      <div class="waiting-content">
        <h1 class="game-title">Qui veut passer<br>pour un teub&eacute; ?</h1>
        <div class="waiting-pulse"></div>
      </div>
    </div>

    <!-- ─── Écran Question ───────────────────────────── -->
    <div id="screen-question" class="screen">
      <div class="question-container">
        <div class="question-header">
          <span id="q-counter" class="q-counter">Question 1</span>
          <div id="q-tags" class="q-tags"></div>
        </div>
        <div id="q-text" class="q-text"></div>
        <div id="q-propositions" class="q-propositions"></div>
      </div>
    </div>

    <!-- ─── Écran Réponse ────────────────────────────── -->
    <div id="screen-answer" class="screen">
      <div class="answer-container">
        <div class="question-header">
          <span id="a-counter" class="q-counter">Question 1</span>
        </div>
        <div id="a-text" class="q-text"></div>
        <div id="a-propositions" class="q-propositions"></div>
        <div id="a-result" class="result-banner hidden"></div>
        <div id="a-explanation" class="explanation hidden"></div>
      </div>
    </div>

    <!-- ─── Écran Scores ─────────────────────────────── -->
    <div id="screen-scores" class="screen">
      <div class="scores-container">
        <h2 class="scores-title">Tableau des scores</h2>
        <div id="scores-board" class="scores-board"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
