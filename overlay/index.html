<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="connection-status" id="connection-status">
      <span class="dot"></span>
      <span class="text">Synchro...</span>
    </div>
    
    <!-- Panel de question -->
    <div class="panel" id="panel">
      <img src="image/logo.png" alt="Logo" class="logo-channel">
      <div class="panel-header">
        <div class="badge">Qui veut passer pour un teubé ?</div>
      </div>
      
      <!-- Écran de sélection dans le panel -->
      <div class="selection-panel" id="selection-panel" style="display:none;">
        <h2 class="selection-title" id="selection-title">Choisissez la difficulté</h2>
        <div class="selection-info" id="selection-info"></div>
        <div class="selection-buttons" id="selection-buttons"></div>
      </div>
      
      <!-- Info de sélection -->
      <div class="selection-info-panel" id="selection-info-panel" style="display:none;">
        <div class="selection-tag">🎯 Difficulté: <span id="info-level">-</span></div>
        <div class="selection-tag">📚 Catégorie: <span id="info-category">-</span></div>
        <div class="selection-tag">🎨 Thème: <span id="info-theme">-</span></div>
      </div>
      
      <div class="question" id="question">En attente d'une question...</div>
      <div class="answers" id="answers">
        <button class="answer" data-index="0">
          <span class="key">A</span>
          <span class="text">---</span>
        </button>
        <button class="answer" data-index="1">
          <span class="key">B</span>
          <span class="text">---</span>
        </button>
        <button class="answer" data-index="2">
          <span class="key">C</span>
          <span class="text">---</span>
        </button>
        <button class="answer" data-index="3">
          <span class="key">D</span>
          <span class="text">---</span>
        </button>
      </div>
      <div class="timer-bar-bottom">
        <div class="timer-fill" id="timer-fill"></div>
        <span class="timer-text" id="timer-text">30s</span>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
